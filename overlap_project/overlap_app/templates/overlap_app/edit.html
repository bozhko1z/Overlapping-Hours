<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Edit Slots</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    {%load static%}
    <link rel="stylesheet" type="text/css" href="{%static 'overlap_app/style.css'%}">
</head>
<body>
<div class="container mt-5">
    <h2 class="text-center mb-4">Edit Working Time Slots</h2>
    <form id="form" method="POST">

        {% csrf_token %}
        {{ formset.management_form }}

        {% for form in formset %}
        <div class="card mb-3 p-3">
            {{ form.as_p }}
        </div>
        {% endfor %}

        <button type="submit" class="btn btn-success">Save Changes</button>
        <button type="submit" class="btn btn-primary" name="action" value="check">Check Overlap</button>
        <a href="/" class="btn btn-secondary">Back to Home</a>
    </form>
    <div id="result">
        {% if result is not None %}
                {% if result %}
                    <div class="fade-out alert alert-success">No Overlap Detected</div>
                {% else %}
                    <div class="fade-out alert alert-danger">Overlap Detected</div>
                {% endif %}
            {% endif %}
    </div>

</div>

</body>
</html>
